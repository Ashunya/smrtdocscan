services:
  api:
    build:
      context: .
      dockerfile: SmartDocScan.Api/Dockerfile
    container_name: smrtdocscan-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__SmartDocScan: ${SMARTDOCSCAN_CONNECTION_STRING}
      Cors__AllowedOrigins__0: https://scandev.ashunya.com
      Store__RootPath: /data/store
    volumes:
      - D:/DMS/store:/data/store
      - ./DataProtection-Keys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: SmartDocScan.Web/Dockerfile
      args:
        VITE_API_BASE_URL: https://scandevapi.ashunya.com/api
        VITE_DEFAULT_COMPANY_ID: ${SMARTDOCSCAN_DEFAULT_COMPANY_ID:-7}
        VITE_DYNAMSOFT_PRODUCT_KEY: ${VITE_DYNAMSOFT_PRODUCT_KEY}
    container_name: smrtdocscan-web
    depends_on:
      - api
    volumes:
      - ./SmartDocScan/Resources:/usr/share/nginx/html/Resources:ro
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: smrtdocscan-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-port=3000"

  tika:
    image: apache/tika:latest-full
    container_name: smrtdocscan-tika
    restart: unless-stopped
    ports:
      - "9998:9998"

  caddy:
    image: caddy:2
    container_name: smrtdocscan-caddy
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./CaddyData:/data
      - ./CaddyConfig:/config
    restart: unless-stopped
