services:
  pgloader:
    image: dimitri/pgloader:latest
    container_name: smrtdocscan-pgloader
    profiles:
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations/pgloader:/migrations:ro
    command: ["pgloader", "/migrations/sqlserver-to-postgres.load"]
    environment:
      SMARTDOCSCAN_SQLSERVER_CONNECTION_STRING: ${SMARTDOCSCAN_SQLSERVER_CONNECTION_STRING}
      SMARTDOCSCAN_POSTGRES_CONNECTION_STRING: ${SMARTDOCSCAN_POSTGRES_CONNECTION_STRING}
